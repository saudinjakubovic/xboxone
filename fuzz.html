<!doctype html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>V8 Deopt Fuzzer</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        h1 { color: #ff0; text-shadow: 0 0 10px #ff0; }
        #status { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #fff; }
        #logs { background: #111; border: 1px solid #0f0; height: 65vh; overflow-y: auto; padding: 10px; font-size: 14px; }
        .crash { color: #fff; background: #f00; font-weight: bold; padding: 5px; }
        button { background: #0f0; color: #000; border: none; padding: 15px 25px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <h1>V8 DEOPT MUTATION FUZZER</h1>
    <button onclick="startFuzz()">POKRENI DEOPT NAPAD</button>
    <div id="status">Status: Čeka...</div>
    <div id="logs"></div>

    <script>
        const logEl = document.getElementById('logs');
        const statusEl = document.getElementById('status');
        let isRunning = false;
        let testId = parseInt(localStorage.getItem('deopt_id') || '0');

        function log(msg, isCrash = false) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (isCrash) div.className = 'crash';
            logEl.prepend(div);
        }

        const crashedId = localStorage.getItem('deopt_crash');
        if (crashedId) {
            log(`!!! DEOPT CRASH NA TESTU ID: ${crashedId} !!!`, true);
            log(`Ovo je pravi JIT bug! Memorija je pukla od deoptimizacije!`, true);
            localStorage.removeItem('deopt_crash');
        } else {
            log(`Deopt fuzzer spreman. ID: ${testId}`);
        }

        function generateDeoptPayload() {
            let rand = Math.random();
            let arraySize = Math.floor(rand * 500) + 10;
            
            return `
                try {
                    // 1. JIT Warmup - V8 misli da je uvijek isti tip
                    function shapeShift(x) {
                        return x.a;
                    }
                    
                    let obj = {a: 1.1};
                    for(let i = 0; i < 50000; i++) {
                        shapeShift(obj);
                    }
                    
                    // 2. Trigger Deoptimization (Type Confusion)
                    for(let j = 0; j < 1000; j++) {
                        shapeShift({a: "string"});
                        shapeShift({a: {}});
                        shapeShift({b: 1}); // Undefined
                    }

                    // 3. Array Sort Mutation (V8 istorijski bug)
                    let arr = [];
                    for(let k = 0; k < ${arraySize}; k++) arr.push(k);
                    
                    arr.sort(function(a, b) {
                        // Mijenjamo niz DOK se sortira - garantovani haos
                        if (a % 10 === 0) { 
                            arr.push("A".repeat(100)); 
                            arr.length = arr.length / 2; 
                        }
                        return a - b;
                    });

                    // 4. Arguments Object Deopt
                    function withArgs() {
                        return arguments[0] + arguments[1];
                    }
                    for(let m = 0; m < 10000; m++) withArgs(1, 2);
                    withArgs("a", "b"); // Deopt
                    withArgs({}, []);   // Deopt

                } catch(e) {}
            `;
        }

        function startFuzz() {
            if (isRunning) return;
            isRunning = true;
            statusEl.textContent = "Status: DEOPT NAPAD U TOKU...";
            log("Kreće gađanje JIT kompajlera i Array mutacija...");

            function loop() {
                if (!isRunning) return;
                
                testId++;
                localStorage.setItem('deopt_id', testId);
                localStorage.setItem('deopt_crash', testId);

                if (testId % 5 === 0) {
                    log(`Test ID: ${testId} - Deopt u toku...`);
                }

                let js = generateDeoptPayload();
                
                let iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                try {
                    let doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write("<!doctype html><html><body></body></html>");
                    doc.close();
                    
                    let script = doc.createElement('script');
                    script.textContent = js;
                    doc.body.appendChild(script);
                } catch(e) {}

                setTimeout(() => {
                    if (localStorage.getItem('deopt_crash') == testId) {
                        localStorage.removeItem('deopt_crash');
                    }
                    if (iframe.parentNode) {
                        document.body.removeChild(iframe);
                    }
                    loop();
                }, 100); 
            }

            loop();
        }
    </script>
</body>
</html>
